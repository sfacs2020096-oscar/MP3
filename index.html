<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频链接自动提取工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { max-width: 800px; margin: 2rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
        #urlInput { width: 100%; padding: 1rem; font-size: 1.1rem; border: 2px solid #007bff; border-radius: 8px; margin-bottom: 1rem; }
        #extractBtn { width: 100%; padding: 1rem; font-size: 1.1rem; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #extractBtn:disabled { background: #6c757d; cursor: not-allowed; }
        #result { margin-top: 1.5rem; padding: 1rem; border: 1px solid #eee; border-radius: 8px; }
        .link-item { margin: 0.5rem 0; padding: 0.5rem; background: #f8f9fa; border-radius: 4px; }
        .link-item a { color: #007bff; text-decoration: none; word-break: break-all; }
        .error { color: #dc3545; }
        .loading { text-align: center; padding: 1rem; color: #6c757d; }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 1.5rem;">音频链接自动提取工具</h1>
    <input type="text" id="urlInput" placeholder="请粘贴目标网址（例如：https://xxx.com）" autocomplete="off">
    <button id="extractBtn" onclick="extractAudioLinks()">开始提取音频链接</button>
    <div id="result"></div>

    <script>
        // 免费跨域代理（无需自己搭建，直接用）
        const PROXY_URL = 'https://corsproxy.io/?';

        async function extractAudioLinks() {
            const urlInput = document.getElementById('urlInput');
            const extractBtn = document.getElementById('extractBtn');
            const resultDiv = document.getElementById('result');
            const targetUrl = urlInput.value.trim();

            // 校验输入
            if (!targetUrl || !targetUrl.startsWith('http')) {
                resultDiv.innerHTML = '<div class="error">❌ 请输入有效的网址（必须以 http/https 开头）</div>';
                return;
            }

            // 加载状态
            extractBtn.disabled = true;
            extractBtn.textContent = '提取中...';
            resultDiv.innerHTML = '<div class="loading">🔍 正在抓取网页并解析音频链接...</div>';

            try {
                // 1. 通过代理抓取目标网页源码
                const response = await fetch(`${PROXY_URL}${encodeURIComponent(targetUrl)}`);
                if (!response.ok) throw new Error('网页抓取失败');
                const html = await response.text();

                // 2. 解析音频链接（支持 mp3/wav/m4a/ogg 格式，匹配绝对路径和相对路径）
                const audioRegex = /(https?:\/\/[^\s]+\.(mp3|wav|m4a|ogg)|\/[^\s]+\.(mp3|wav|m4a|ogg))/gi;
                const rawLinks = [...new Set(html.match(audioRegex) || [])]; // 去重

                // 3. 处理相对路径（拼接目标网址域名）
                const parsedLinks = rawLinks.map(link => {
                    if (link.startsWith('http')) return link; // 绝对路径直接返回
                    // 相对路径拼接域名（处理 https://xxx.com + /audio/1.mp3 情况）
                    const domain = targetUrl.split('/').slice(0, 3).join('/');
                    return `${domain}${link.startsWith('/') ? link : '/' + link}`;
                });

                // 4. 展示结果
                if (parsedLinks.length === 0) {
                    resultDiv.innerHTML = '<div class="error">❌ 未找到任何音频链接（支持 mp3/wav/m4a/ogg 格式）</div>';
                } else {
                    resultDiv.innerHTML = `<div style="margin-bottom: 1rem;">✅ 共找到 ${parsedLinks.length} 个音频链接：</div>`;
                    parsedLinks.forEach((link, index) => {
                        resultDiv.innerHTML += `
                            <div class="link-item">
                                <span>${index + 1}. </span>
                                <a href="${link}" target="_blank" rel="noopener">${link}</a>
                                <button style="margin-left: 0.5rem; padding: 0.2rem 0.5rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="copyLink('${link}', this)">复制</button>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 提取失败：${error.message}（可能是网址无法访问或被反爬）</div>`;
            } finally {
                // 恢复状态
                extractBtn.disabled = false;
                extractBtn.textContent = '开始提取音频链接';
            }
        }

        // 复制链接功能
        function copyLink(link, btn) {
            navigator.clipboard.writeText(link);
            const originalText = btn.textContent;
            btn.textContent = '已复制';
            setTimeout(() => btn.textContent = originalText, 2000);
        }
    </script>
</body>
</html>
